<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Report Not Found</title>
  <style>
    :root { --bg: #f6f7f9; --text: #1b1f24; --muted: #5b6470; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #111418; --text: #e7eaee; --muted: #9aa3ad; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 80px 16px; text-align: center; }
    p { color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>리포트를 찾을 수 없습니다</h1>
  <p>주소가 정확한지 확인해 주세요.</p>
</main>
</body>
</html>
