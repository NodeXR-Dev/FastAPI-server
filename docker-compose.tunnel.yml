# 로컬 서버를 고정 주소로 인터넷에 연결한다(팀원들이 각자 집에서 접속용).
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d
#
# 개발용 docker-compose.yml 은 건드리지 않는다. 이 파일을 붙일 때만 터널이 뜬다.
# 백엔드만 로컬에서 돌리는 팀원은 이 파일을 쓰지 않으면 된다.
#
# 주소가 고정이라는 게 핵심이다. Unity 클라이언트는 서버 주소를 앱 안에 구워서
# 빌드하므로, 주소가 바뀌면 팀원 헤드셋마다 앱을 다시 깔아야 한다.
#
# NGROK_AUTHTOKEN / NGROK_URL 은 .env 에서 읽는다(.env 는 git 에 안 올라간다).

services:
  # 백엔드와 MinIO 를 한 주소로 합친다.
  # ngrok 무료 계정은 고정 주소가 하나뿐이라 둘을 각각 내보낼 수 없는데,
  # 생성된 2D 이미지는 MinIO 가 직접 서빙하므로 백엔드만 열면 클라이언트가
  # 이미지를 받지 못한다(image_url 이 localhost:9000 으로 내려간다).
  tunnel-proxy:
    image: caddy:2-alpine
    container_name: nodexr-tunnel-proxy
    restart: unless-stopped
    volumes:
      - ./Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - minio

  ngrok:
    image: ngrok/ngrok:latest
    container_name: nodexr-ngrok
    restart: unless-stopped
    # 같은 compose 네트워크 안이라 컨테이너 이름으로 바로 붙는다.
    # (ngrok 안내 문구의 host.docker.internal 은 필요 없다)
    command:
      - http
      - tunnel-proxy:80
      - --url=${NGROK_URL}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - tunnel-proxy
